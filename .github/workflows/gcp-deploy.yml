name: Deploy GCP broker

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create the registry once or build and deploy the reviewed broker.
        required: true
        type: choice
        options:
          - bootstrap
          - deploy

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-broker-deployment
  cancel-in-progress: false

env:
  ARTIFACT_REPOSITORY: release-broker-images
  BROKER_SERVICE: git-governance-release-broker
  BROKER_SECRET: github-release-automation-private-key
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_SDK_VERSION: ${{ vars.GCP_SDK_VERSION }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
  RELEASE_APP_INSTALLATION_ID: ${{ vars.RELEASE_APP_INSTALLATION_ID }}
  BROKER_ALLOWED_REPOSITORIES: ${{ vars.BROKER_ALLOWED_REPOSITORIES }}

jobs:
  bootstrap:
    if: ${{ inputs.operation == 'bootstrap' }}
    name: Bootstrap Artifact Registry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: gcp-broker-deployment
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Require deployable configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          for variable in GCP_PROJECT_ID GCP_REGION GCP_SDK_VERSION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT; do
            test -n "${!variable:-}" || { echo "missing GitHub variable: $variable" >&2; exit 1; }
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ${{ vars.GCP_SDK_VERSION }}

      - name: Create Docker Artifact Registry repository
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --location="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$ARTIFACT_REPOSITORY" \
              --repository-format=docker \
              --location="$GCP_REGION" \
              --description="Immutable images for git-governance-release-broker" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi

  deploy:
    if: ${{ inputs.operation == 'deploy' }}
    name: Build and deploy broker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: gcp-broker-deployment
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Require deployable configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          for variable in GCP_PROJECT_ID GCP_REGION GCP_SDK_VERSION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT RELEASE_APP_ID RELEASE_APP_INSTALLATION_ID BROKER_ALLOWED_REPOSITORIES; do
            test -n "${!variable:-}" || { echo "missing GitHub variable: $variable" >&2; exit 1; }
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ${{ vars.GCP_SDK_VERSION }}

      - name: Build and push immutable broker image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --location="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" >/dev/null
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/broker:sha-${GITHUB_SHA}"
          docker build --platform=linux/amd64 --pull --tag "$image" .
          docker push "$image"
          digest="$(gcloud artifacts docker images describe "$image" \
            --format='value(image_summary.digest)' \
            --project="$GCP_PROJECT_ID")"
          test -n "$digest"
          echo "reference=${image%@*}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Deploy private Cloud Run broker
        shell: bash
        run: |
          set -euo pipefail
          runtime_service_account="broker-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          gcloud run deploy "$BROKER_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="${{ steps.image.outputs.reference }}" \
            --service-account="$runtime_service_account" \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=1 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=10s \
            --execution-environment=gen2 \
            --set-env-vars="^@^BROKER_APP_ID=${RELEASE_APP_ID}@BROKER_APP_INSTALLATION_ID=${RELEASE_APP_INSTALLATION_ID}@BROKER_CREDENTIAL_PROFILE=release-automation@BROKER_PRIVATE_KEY_PATH=/var/run/secrets/github-app/private-key.pem@BROKER_ALLOWED_REPOSITORIES=${BROKER_ALLOWED_REPOSITORIES}" \
            --update-secrets="/var/run/secrets/github-app/private-key.pem=${BROKER_SECRET}:1" \
            --quiet

      - name: Grant only the broker invoker service account access
        shell: bash
        run: |
          set -euo pipefail
          invoker_service_account="release-broker-invoker@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          gcloud run services add-iam-policy-binding "$BROKER_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --member="serviceAccount:${invoker_service_account}" \
            --role="roles/run.invoker" \
            --quiet
