name: Promote Broker Production Artifact

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full lower-case Git commit SHA for the reviewed staging image.
        required: true
        type: string

permissions:
  attestations: read
  contents: read
  id-token: write

concurrency:
  group: gcp-broker-production-artifact-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Broker Production Artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: gcp-broker-production
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_SDK_VERSION: ${{ vars.GCP_SDK_VERSION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_PRODUCTION_ARTIFACT_PROMOTION_WIF_PROVIDER }}
      GCP_PROMOTER_SERVICE_ACCOUNT: ${{ vars.GCP_PRODUCTION_ARTIFACT_PROMOTER_SERVICE_ACCOUNT }}
      SOURCE_ARTIFACT_REPOSITORY: ${{ vars.GCP_PRODUCTION_SOURCE_ARTIFACT_REPOSITORY }}
      TARGET_ARTIFACT_REPOSITORY: ${{ vars.GCP_PRODUCTION_ARTIFACT_REPOSITORY }}
      SOURCE_EVIDENCE_ARTIFACT_REPOSITORY: ${{ vars.GCP_PRODUCTION_SOURCE_EVIDENCE_ARTIFACT_REPOSITORY }}
      TARGET_EVIDENCE_ARTIFACT_REPOSITORY: ${{ vars.GCP_PRODUCTION_EVIDENCE_ARTIFACT_REPOSITORY }}
    steps:
      - name: Check out trusted production control plane
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable promotion inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          for variable in SOURCE_COMMIT GCP_PROJECT_ID GCP_REGION GCP_SDK_VERSION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_PROMOTER_SERVICE_ACCOUNT SOURCE_ARTIFACT_REPOSITORY TARGET_ARTIFACT_REPOSITORY SOURCE_EVIDENCE_ARTIFACT_REPOSITORY TARGET_EVIDENCE_ARTIFACT_REPOSITORY; do
            test -n "${!variable:-}" || { echo "missing GitHub environment variable: $variable" >&2; exit 1; }
          done
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "source_commit must be a full lower-case Git SHA" >&2; exit 1; }
          test "$SOURCE_ARTIFACT_REPOSITORY" != "$TARGET_ARTIFACT_REPOSITORY"
          test "$SOURCE_EVIDENCE_ARTIFACT_REPOSITORY" != "$TARGET_EVIDENCE_ARTIFACT_REPOSITORY"
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD || {
            echo "source_commit must be reachable from main" >&2
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_PROMOTER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ${{ env.GCP_SDK_VERSION }}

      - id: source
        name: Resolve immutable staging image
        shell: bash
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev"
          source_tag="${registry}/${GCP_PROJECT_ID}/${SOURCE_ARTIFACT_REPOSITORY}/broker:sha-${SOURCE_COMMIT}"
          source_digest="$(gcloud artifacts docker images describe "$source_tag" \
            --project="$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')"
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "source image did not resolve to an immutable digest" >&2
            exit 1
          }
          echo "reference=${source_tag}@${source_digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${source_digest}" >> "$GITHUB_OUTPUT"

      - name: Verify immutable staging evidence
        uses: ./.github/actions/verify-broker-evidence
        with:
          image: ${{ steps.source.outputs.reference }}
          project-id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          evidence-repository: ${{ env.SOURCE_EVIDENCE_ARTIFACT_REPOSITORY }}
          signer-workflow: .github/workflows/gcp-broker-staging.yml
          source-ref: refs/heads/develop

      - name: Promote immutable staging image without rebuild
        id: promotion
        shell: bash
        env:
          SOURCE_IMAGE: ${{ steps.source.outputs.reference }}
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev"
          target_tag="${registry}/${GCP_PROJECT_ID}/${TARGET_ARTIFACT_REPOSITORY}/broker:sha-${SOURCE_COMMIT}"
          gcloud auth configure-docker "$registry" --quiet
          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$target_tag"
          docker push "$target_tag"
          target_digest="$(gcloud artifacts docker images describe "$target_tag" \
            --project="$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')"
          test "$target_digest" = "$SOURCE_DIGEST"
          echo "image=${registry}/${GCP_PROJECT_ID}/${TARGET_ARTIFACT_REPOSITORY}/broker@${target_digest}" >> "$GITHUB_OUTPUT"

      - name: Store immutable production evidence
        shell: bash
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
          SOURCE_IMAGE: ${{ steps.source.outputs.reference }}
          TARGET_IMAGE: ${{ steps.promotion.outputs.image }}
          TARGET_LANE: release-automation
          PROMOTER_SERVICE_ACCOUNT: ${{ env.GCP_PROMOTER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          evidence_directory="$(mktemp -d)"
          trap 'rm -rf "$evidence_directory"' EXIT
          gcloud artifacts generic download \
            --project="$GCP_PROJECT_ID" \
            --location="$GCP_REGION" \
            --repository="$SOURCE_EVIDENCE_ARTIFACT_REPOSITORY" \
            --package=broker-evidence \
            --version="${SOURCE_DIGEST#sha256:}" \
            --destination="$evidence_directory"
          manifest="$evidence_directory/manifest.json"
          manifest_sha256="$(sha256sum "$manifest" | awk '{print $1}')"
          source_commit="$(jq -er '.subjects.source.commit' "$manifest")"
          source_image="$(jq -er '.subjects.artifact.reference' "$manifest")"
          source_digest="${SOURCE_IMAGE##*@}"
          target_digest="${TARGET_IMAGE##*@}"
          test "$source_image" = "$SOURCE_IMAGE"
          test "$source_digest" = "$SOURCE_DIGEST"
          test "$target_digest" = "$SOURCE_DIGEST"
          jq -n \
            --arg source_commit "$source_commit" \
            --arg source_image "$source_image" \
            --arg source_digest "$source_digest" \
            --arg manifest_sha256 "$manifest_sha256" \
            --arg target_image "$TARGET_IMAGE" \
            --arg target_digest "$target_digest" \
            --arg target_lane "$TARGET_LANE" \
            --arg workflow ".github/workflows/gcp-broker-production-promotion.yml" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg promoter_service_account "$PROMOTER_SERVICE_ACCOUNT" \
            '{
              schema_version: 1,
              subject: {
                type: "promotion",
                id: ("promotion:" + $target_lane + ":" + $target_digest),
                digest: $target_digest
              },
              source: {
                commit: $source_commit,
                image: $source_image,
                digest: $source_digest,
                manifest_sha256: $manifest_sha256
              },
              target: {
                image: $target_image,
                digest: $target_digest,
                lane: $target_lane
              },
              authority: {
                workflow: $workflow,
                workflow_run_id: $workflow_run_id,
                workflow_run_attempt: $workflow_run_attempt,
                promoter_service_account: $promoter_service_account
              },
              policy: {
                approval_status: "environment-gated"
              }
            }' > "$evidence_directory/promotion.json"
          gcloud artifacts generic upload \
            --project="$GCP_PROJECT_ID" \
            --location="$GCP_REGION" \
            --repository="$TARGET_EVIDENCE_ARTIFACT_REPOSITORY" \
            --package=broker-evidence \
            --version="${SOURCE_DIGEST#sha256:}" \
            --source-directory="$evidence_directory" \
            --skip-existing
