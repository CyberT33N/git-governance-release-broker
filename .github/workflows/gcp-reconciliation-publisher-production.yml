name: Deploy Reconciliation Publisher Broker

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable reconciliation publisher image reference ending in @sha256:<digest>.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-reconciliation-publisher-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Reconciliation Publisher Broker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: gcp-reconciliation-publisher-deployment
    env:
      IMAGE: ${{ inputs.image }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_SDK_VERSION: ${{ vars.GCP_SDK_VERSION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_RECONCILIATION_PUBLISHER_DEPLOYMENT_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_RECONCILIATION_PUBLISHER_DEPLOYMENT_SERVICE_ACCOUNT }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_RECONCILIATION_PUBLISHER_ARTIFACT_REPOSITORY }}
      BROKER_SERVICE: ${{ vars.GCP_RECONCILIATION_PUBLISHER_BROKER_SERVICE }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RECONCILIATION_PUBLISHER_RUNTIME_SERVICE_ACCOUNT }}
      INVOKER_SERVICE_ACCOUNT: ${{ vars.GCP_RECONCILIATION_PUBLISHER_INVOKER_SERVICE_ACCOUNT }}
      BROKER_SECRET: ${{ vars.GCP_RECONCILIATION_PUBLISHER_BROKER_SECRET }}
      BROKER_APP_ID: ${{ vars.GCP_RECONCILIATION_PUBLISHER_BROKER_APP_ID }}
      BROKER_APP_INSTALLATION_ID: ${{ vars.GCP_RECONCILIATION_PUBLISHER_BROKER_APP_INSTALLATION_ID }}
      BROKER_ALLOWED_REPOSITORIES: ${{ vars.GCP_RECONCILIATION_PUBLISHER_BROKER_ALLOWED_REPOSITORIES }}
    steps:
      - name: Check out trusted production control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Require publisher production inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          for variable in IMAGE GCP_PROJECT_ID GCP_REGION GCP_SDK_VERSION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT ARTIFACT_REPOSITORY BROKER_SERVICE RUNTIME_SERVICE_ACCOUNT INVOKER_SERVICE_ACCOUNT BROKER_SECRET BROKER_APP_ID BROKER_APP_INSTALLATION_ID BROKER_ALLOWED_REPOSITORIES; do
            test -n "${!variable:-}" || { echo "missing GitHub environment variable: $variable" >&2; exit 1; }
          done
          expected_prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/broker@sha256:"
          case "$IMAGE" in
            "$expected_prefix"[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*)
              ;;
            *)
              echo "image must be an immutable digest in the configured publisher repository" >&2
              exit 1
              ;;
          esac
          digest="${IMAGE##*@sha256:}"
          test "${#digest}" -eq 64
          test "$digest" = "$(printf '%s' "$digest" | tr -cd '0-9a-f')"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ${{ env.GCP_SDK_VERSION }}

      - name: Verify immutable publisher image exists
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts docker images describe "$IMAGE" \
            --project="$GCP_PROJECT_ID" >/dev/null

      - name: Deploy private reconciliation publisher broker
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$BROKER_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=1 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=10s \
            --execution-environment=gen2 \
            --set-env-vars="^@^BROKER_APP_ID=${BROKER_APP_ID}@BROKER_APP_INSTALLATION_ID=${BROKER_APP_INSTALLATION_ID}@BROKER_CREDENTIAL_PROFILE=reconciliation-publisher@BROKER_PRIVATE_KEY_PATH=/var/run/secrets/github-app/private-key.pem@BROKER_ALLOWED_REPOSITORIES=${BROKER_ALLOWED_REPOSITORIES}" \
            --update-secrets="/var/run/secrets/github-app/private-key.pem=${BROKER_SECRET}:1" \
            --quiet

      - name: Grant only reconciliation publisher invoker access
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding "$BROKER_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --member="serviceAccount:${INVOKER_SERVICE_ACCOUNT}" \
            --role="roles/run.invoker" \
            --quiet
