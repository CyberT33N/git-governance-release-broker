name: Deploy Broker Staging

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create the isolated staging registry once or deploy the reviewed develop revision.
        required: true
        type: choice
        options:
          - bootstrap
          - deploy

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: gcp-broker-staging-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ inputs.operation == 'bootstrap' }}
    name: Bootstrap Broker Staging Registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: gcp-broker-staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_SDK_VERSION: ${{ vars.GCP_SDK_VERSION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_STAGING_ARTIFACT_REPOSITORY }}
      EVIDENCE_ARTIFACT_REPOSITORY: ${{ vars.GCP_STAGING_EVIDENCE_ARTIFACT_REPOSITORY }}
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Require staging control-plane inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          for variable in GCP_PROJECT_ID GCP_REGION GCP_SDK_VERSION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT ARTIFACT_REPOSITORY EVIDENCE_ARTIFACT_REPOSITORY; do
            test -n "${!variable:-}" || { echo "missing GitHub environment variable: $variable" >&2; exit 1; }
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ${{ env.GCP_SDK_VERSION }}

      - name: Create isolated staging Docker repository
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --location="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$ARTIFACT_REPOSITORY" \
              --repository-format=docker \
              --location="$GCP_REGION" \
              --description="Staging images for git-governance-release-broker" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi
          if ! gcloud artifacts repositories describe "$EVIDENCE_ARTIFACT_REPOSITORY" \
            --location="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$EVIDENCE_ARTIFACT_REPOSITORY" \
              --repository-format=generic \
              --location="$GCP_REGION" \
              --description="Immutable broker staging evidence" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi

  deploy:
    if: ${{ inputs.operation == 'deploy' }}
    name: Build and Deploy Broker Staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: gcp-broker-staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_SDK_VERSION: ${{ vars.GCP_SDK_VERSION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_STAGING_ARTIFACT_REPOSITORY }}
      EVIDENCE_ARTIFACT_REPOSITORY: ${{ vars.GCP_STAGING_EVIDENCE_ARTIFACT_REPOSITORY }}
      BUILDER_ARTIFACT_REPOSITORY: ${{ vars.GCP_STAGING_BUILDER_ARTIFACT_REPOSITORY }}
      BUILDER_EVIDENCE_ARTIFACT_REPOSITORY: ${{ vars.GCP_STAGING_BUILDER_EVIDENCE_ARTIFACT_REPOSITORY }}
      BUILDER_IMAGE: ${{ vars.GCP_STAGING_BUILDER_IMAGE }}
      BUILDER_SIGNER_REPOSITORY: ${{ vars.GCP_STAGING_BUILDER_SIGNER_REPOSITORY }}
      BUILDER_SIGNER_WORKFLOW: ${{ vars.GCP_STAGING_BUILDER_SIGNER_WORKFLOW }}
      BUILDER_SOURCE_REF: ${{ vars.GCP_STAGING_BUILDER_SOURCE_REF }}
      BROKER_SERVICE: ${{ vars.GCP_STAGING_BROKER_SERVICE }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_RUNTIME_SERVICE_ACCOUNT }}
      INVOKER_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_INVOKER_SERVICE_ACCOUNT }}
      BROKER_SECRET: ${{ vars.GCP_STAGING_BROKER_SECRET }}
      BROKER_APP_ID: ${{ vars.GCP_STAGING_BROKER_APP_ID }}
      BROKER_APP_INSTALLATION_ID: ${{ vars.GCP_STAGING_BROKER_APP_INSTALLATION_ID }}
      BROKER_ALLOWED_REPOSITORIES: ${{ vars.GCP_STAGING_BROKER_ALLOWED_REPOSITORIES }}
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Require staging deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          for variable in GCP_PROJECT_ID GCP_REGION GCP_SDK_VERSION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT ARTIFACT_REPOSITORY EVIDENCE_ARTIFACT_REPOSITORY BUILDER_ARTIFACT_REPOSITORY BUILDER_EVIDENCE_ARTIFACT_REPOSITORY BUILDER_IMAGE BUILDER_SIGNER_REPOSITORY BUILDER_SIGNER_WORKFLOW BUILDER_SOURCE_REF BROKER_SERVICE RUNTIME_SERVICE_ACCOUNT INVOKER_SERVICE_ACCOUNT BROKER_SECRET BROKER_APP_ID BROKER_APP_INSTALLATION_ID BROKER_ALLOWED_REPOSITORIES; do
            test -n "${!variable:-}" || { echo "missing GitHub environment variable: $variable" >&2; exit 1; }
          done

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: true
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ${{ env.GCP_SDK_VERSION }}

      - name: Authenticate Docker client to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          logout: true

      - id: builder-evidence
        name: Verify approved builder artifact evidence
        uses: ./.github/actions/verify-broker-builder-evidence
        with:
          image: ${{ env.BUILDER_IMAGE }}
          project-id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          artifact-repository: ${{ env.BUILDER_ARTIFACT_REPOSITORY }}
          evidence-repository: ${{ env.BUILDER_EVIDENCE_ARTIFACT_REPOSITORY }}
          signer-repository: ${{ env.BUILDER_SIGNER_REPOSITORY }}
          signer-workflow: ${{ env.BUILDER_SIGNER_WORKFLOW }}
          source-ref: ${{ env.BUILDER_SOURCE_REF }}

      - name: Prepare staging evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/evidence

      - id: builder-materialization
        name: Materialize local builder and isolated dependency evidence
        shell: bash
        env:
          BUILDER_IMAGE: ${{ steps.builder-evidence.outputs.image }}
          BUILDER_SUBJECT_ID: ${{ steps.builder-evidence.outputs.subject-id }}
          BUILDER_CANONICAL_PAYLOAD_DIGEST: ${{ steps.builder-evidence.outputs.canonical-payload-digest }}
        run: |
          set -euo pipefail
          builder_image="$BUILDER_IMAGE"
          test -n "$builder_image"
          builder_digest="${builder_image##*@}"
          [[ "$builder_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          local_builder_image="broker-local-builder:${builder_digest#sha256:}"
          docker pull --platform=linux/amd64 "$builder_image"
          docker tag "$builder_image" "$local_builder_image"
          local_builder_digests="$(docker image inspect "$local_builder_image" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          printf '%s\n' "$local_builder_digests" | awk -F@ -v expected="$builder_digest" '$NF == expected { found = 1 } END { exit !found }'
          test "$(docker image inspect "$local_builder_image" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          mount="type=bind,source=${GITHUB_WORKSPACE},target=/src,readonly"
          docker run --rm \
            --pull=never \
            --network=none \
            --mount "$mount" \
            --workdir=/src \
            --env GOPROXY=off \
            --env GOTOOLCHAIN=local \
            --env GOFLAGS=-mod=readonly \
            --entrypoint go \
            "$local_builder_image" list -m -json all | jq -sS . > .build/evidence/dependency-resolution.json
          test -s .build/evidence/dependency-resolution.json
          docker run --rm \
            --pull=never \
            --network=none \
            --mount "$mount" \
            --workdir=/src \
            --env GOPROXY=off \
            --env GOTOOLCHAIN=local \
            --env GOFLAGS=-mod=readonly \
            --entrypoint go \
            "$local_builder_image" mod verify
          docker run --rm \
            --pull=never \
            --network=none \
            --mount "$mount" \
            --workdir=/src \
            --env GOPROXY=off \
            --env GOTOOLCHAIN=local \
            --env GOFLAGS=-mod=readonly \
            --entrypoint go \
            "$local_builder_image" test -mod=readonly ./...
          go_toolchain="$(docker run --rm --pull=never --network=none --entrypoint go "$local_builder_image" env GOVERSION)"
          test -n "$go_toolchain"
          jq -n \
            --arg source_commit "$GITHUB_SHA" \
            --arg builder_image "$builder_image" \
            --arg builder_subject_id "$BUILDER_SUBJECT_ID" \
            --arg builder_digest "$builder_digest" \
            --arg builder_canonical_payload_digest "$BUILDER_CANONICAL_PAYLOAD_DIGEST" \
            --arg go_toolchain "$go_toolchain" \
            --arg issued_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: "evidence-graph/v1",
              evidence_type: "test",
              source_commit: $source_commit,
              builder_image: $builder_image,
              builder_subject_id: $builder_subject_id,
              builder_digest: $builder_digest,
              builder_canonical_payload_digest: $builder_canonical_payload_digest,
              go_toolchain: $go_toolchain,
              commands: [
                "GOPROXY=off GOTOOLCHAIN=local GOFLAGS=-mod=readonly go mod verify",
                "GOPROXY=off GOTOOLCHAIN=local GOFLAGS=-mod=readonly go test -mod=readonly ./..."
              ],
              status: "passed",
              issued_at: $issued_at
            }' > .build/evidence/test-result.json
          echo "local-image=$local_builder_image" >> "$GITHUB_OUTPUT"

      - name: Build immutable staging image
        id: image-build
        shell: bash
        env:
          LOCAL_BUILDER_IMAGE: ${{ steps.builder-materialization.outputs.local-image }}
        run: |
          set -euo pipefail
          test -n "$LOCAL_BUILDER_IMAGE"
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --location="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" >/dev/null
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/broker:sha-${GITHUB_SHA}"
          docker build --platform=linux/amd64 --pull=false --network=none --build-arg "BUILDER_IMAGE=$LOCAL_BUILDER_IMAGE" --tag "$image" .
          echo "tag=${image}" >> "$GITHUB_OUTPUT"
          echo "repository=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/broker" >> "$GITHUB_OUTPUT"

      - name: Push immutable staging image
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-build.outputs.tag }}
          IMAGE_REPOSITORY: ${{ steps.image-build.outputs.repository }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" \
            --format='value(image_summary.digest)' \
            --project="$GCP_PROJECT_ID")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "reference=${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
          echo "repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # cosign-installer v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Generate staging image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.reference }}
          format: spdx-json
          output-file: .build/evidence/broker.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign and verify immutable staging image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/gcp-broker-staging.yml@refs/heads/develop"
          cosign sign --yes "$IMAGE"
          cosign verify \
            --certificate-identity="$identity" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE" >/dev/null

      - id: provenance
        name: Attest staging image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: true

      - id: sbom
        name: Attest staging image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: .build/evidence/broker.spdx.json
          push-to-registry: true
          create-storage-record: true

      - id: evidence
        name: Prepare immutable staging evidence graph
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          DIGEST: ${{ steps.image.outputs.digest }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          BUILDER_IMAGE: ${{ steps.builder-evidence.outputs.image }}
          BUILDER_SUBJECT_ID: ${{ steps.builder-evidence.outputs.subject-id }}
          BUILDER_CANONICAL_PAYLOAD_DIGEST: ${{ steps.builder-evidence.outputs.canonical-payload-digest }}
          BUILDER_ARTIFACT_REPOSITORY: ${{ env.BUILDER_ARTIFACT_REPOSITORY }}
          BUILDER_EVIDENCE_ARTIFACT_REPOSITORY: ${{ env.BUILDER_EVIDENCE_ARTIFACT_REPOSITORY }}
          BUILDER_SIGNER_REPOSITORY: ${{ env.BUILDER_SIGNER_REPOSITORY }}
          BUILDER_SIGNER_WORKFLOW: ${{ env.BUILDER_SIGNER_WORKFLOW }}
          BUILDER_SOURCE_REF: ${{ env.BUILDER_SOURCE_REF }}
        run: |
          set -euo pipefail
          package_directory=".build/evidence/package"
          mkdir -p "$package_directory"
          cp .build/evidence/broker.spdx.json "$package_directory/broker.spdx.json"
          cp .build/evidence/dependency-resolution.json "$package_directory/dependency-resolution.json"
          cp .build/evidence/test-result.json "$package_directory/test-result.json"
          cp "$PROVENANCE_BUNDLE" "$package_directory/provenance.intoto.jsonl"
          cp "$SBOM_BUNDLE" "$package_directory/sbom.intoto.jsonl"
          cosign download signature "$IMAGE" > "$package_directory/signature.json"
          test -s "$package_directory/signature.json"

          issued_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source_repository="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          source_ref="refs/heads/develop"
          issuer="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/gcp-broker-staging.yml@${source_ref}"
          evidence_version="${DIGEST#sha256:}"
          source_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          go_mod_sha256="$(sha256sum go.mod | awk '{print $1}')"
          go_sum_sha256=""
          if test -f go.sum; then
            go_sum_sha256="$(sha256sum go.sum | awk '{print $1}')"
          fi
          dependency_resolution_sha256="$(sha256sum "$package_directory/dependency-resolution.json" | awk '{print $1}')"
          test_result_sha256="$(sha256sum "$package_directory/test-result.json" | awk '{print $1}')"
          sbom_sha256="$(sha256sum "$package_directory/broker.spdx.json" | awk '{print $1}')"
          signature_sha256="$(sha256sum "$package_directory/signature.json" | awk '{print $1}')"
          provenance_bundle_sha256="$(sha256sum "$package_directory/provenance.intoto.jsonl" | awk '{print $1}')"
          sbom_bundle_sha256="$(sha256sum "$package_directory/sbom.intoto.jsonl" | awk '{print $1}')"
          dockerfile_sha256="$(sha256sum Dockerfile | awk '{print $1}')"
          go_directive="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          go_toolchain="$(awk '$1 == "toolchain" { print $2; exit }' go.mod)"
          builder_image="$BUILDER_IMAGE"
          builder_digest="${builder_image##*@}"
          builder_evidence_version="${builder_digest#sha256:}"
          test -n "$go_directive"
          test -n "$go_toolchain"
          test -n "$builder_image"
          test -n "$BUILDER_SUBJECT_ID"
          test -n "$BUILDER_CANONICAL_PAYLOAD_DIGEST"
          test -n "$BUILDER_ARTIFACT_REPOSITORY"
          test -n "$BUILDER_EVIDENCE_ARTIFACT_REPOSITORY"
          test -n "$BUILDER_SIGNER_REPOSITORY"
          test -n "$BUILDER_SIGNER_WORKFLOW"
          test -n "$BUILDER_SOURCE_REF"
          [[ "$builder_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BUILDER_CANONICAL_PAYLOAD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          source_subject_id="source:git-commit:${GITHUB_SHA}"
          dependency_subject_id="dependency-resolution:sha256:${dependency_resolution_sha256}"
          build_subject_id="build:broker:${GITHUB_SHA}:${dockerfile_sha256}:${builder_evidence_version}"
          artifact_subject_id="artifact:oci-image:${DIGEST}"

          jq -n \
            --arg issuer "$issuer" \
            --arg issued_at "$issued_at" \
            --arg source_repository "$source_repository" \
            --arg source_commit "$GITHUB_SHA" \
            --arg source_tree "$source_tree" \
            --arg source_ref "$source_ref" \
            --arg source_subject_id "$source_subject_id" \
            --arg dependency_subject_id "$dependency_subject_id" \
            '{
              schema: "evidence-graph/v1",
              document: {
                id: ("document:" + $source_subject_id),
                type: "subject",
                issuer: $issuer,
                created_at: $issued_at
              },
              subject: {
                id: $source_subject_id,
                type: "source",
                primary_digest: ("git-sha1:" + $source_commit)
              },
              relations: [
                {
                  relation_type: "resolves",
                  source_subject_id: $source_subject_id,
                  target_subject_id: $dependency_subject_id
                }
              ],
              evidence: [],
              policy: {
                bundle_id: "not-recorded",
                decision: "pending",
                exception: null,
                approval: {
                  status: "not-recorded"
                }
              },
              lifecycle: {
                status: "pending",
                target_lane: "staging",
                phase_references: {
                  authorized_scope: "broker-staging-build"
                }
              },
              source: {
                repository: $source_repository,
                commit: $source_commit,
                tree: $source_tree,
                protected_ref: $source_ref
              }
            }' > "$package_directory/source.subject.payload.json"

          jq -n \
            --arg issuer "$issuer" \
            --arg issued_at "$issued_at" \
            --arg source_subject_id "$source_subject_id" \
            --arg dependency_subject_id "$dependency_subject_id" \
            --arg build_subject_id "$build_subject_id" \
            --arg go_mod_sha256 "sha256:${go_mod_sha256}" \
            --arg go_sum_sha256 "$go_sum_sha256" \
            --arg dependency_resolution_sha256 "sha256:${dependency_resolution_sha256}" \
            --arg evidence_repository "$EVIDENCE_ARTIFACT_REPOSITORY" \
            --arg evidence_version "$evidence_version" \
            '{
              schema: "evidence-graph/v1",
              document: {
                id: ("document:" + $dependency_subject_id),
                type: "subject",
                issuer: $issuer,
                created_at: $issued_at
              },
              subject: {
                id: $dependency_subject_id,
                type: "dependency-resolution",
                primary_digest: $dependency_resolution_sha256
              },
              relations: [
                {
                  relation_type: "resolves",
                  source_subject_id: $source_subject_id,
                  target_subject_id: $dependency_subject_id
                },
                {
                  relation_type: "built-from",
                  source_subject_id: $dependency_subject_id,
                  target_subject_id: $build_subject_id
                }
              ],
              evidence: [],
              policy: {
                bundle_id: "not-recorded",
                decision: "pending",
                exception: null,
                approval: {
                  status: "not-recorded"
                }
              },
              lifecycle: {
                status: "pending",
                target_lane: "staging"
              },
              dependency_resolution: {
                go_mod: {
                  path: "go.mod",
                  digest: $go_mod_sha256
                },
                go_sum: (
                  if $go_sum_sha256 == "" then
                    null
                  else
                    {
                      path: "go.sum",
                      digest: ("sha256:" + $go_sum_sha256)
                    }
                  end
                ),
                module_graph: {
                  immutable_reference: {
                    repository: $evidence_repository,
                    package: "broker-evidence",
                    version: $evidence_version,
                    file: "dependency-resolution.json"
                  },
                  digest: $dependency_resolution_sha256
                },
                admission: {
                  status: "not-recorded",
                  exceptions: []
                }
              }
            }' > "$package_directory/dependency-resolution.subject.payload.json"

          jq -n \
            --arg issuer "$issuer" \
            --arg issued_at "$issued_at" \
            --arg source_subject_id "$source_subject_id" \
            --arg dependency_subject_id "$dependency_subject_id" \
            --arg build_subject_id "$build_subject_id" \
            --arg artifact_subject_id "$artifact_subject_id" \
            --arg dockerfile_sha256 "sha256:${dockerfile_sha256}" \
            --arg builder_image "$builder_image" \
            --arg builder_digest "$builder_digest" \
            --arg builder_subject_id "$BUILDER_SUBJECT_ID" \
            --arg builder_canonical_payload_digest "$BUILDER_CANONICAL_PAYLOAD_DIGEST" \
            --arg builder_artifact_repository "$BUILDER_ARTIFACT_REPOSITORY" \
            --arg builder_evidence_repository "$BUILDER_EVIDENCE_ARTIFACT_REPOSITORY" \
            --arg builder_evidence_version "$builder_evidence_version" \
            --arg builder_signer_repository "$BUILDER_SIGNER_REPOSITORY" \
            --arg builder_signer_workflow "$BUILDER_SIGNER_WORKFLOW" \
            --arg builder_source_ref "$BUILDER_SOURCE_REF" \
            --arg go_directive "$go_directive" \
            --arg go_toolchain "$go_toolchain" \
            --arg evidence_repository "$EVIDENCE_ARTIFACT_REPOSITORY" \
            --arg evidence_version "$evidence_version" \
            --arg test_result_sha256 "sha256:${test_result_sha256}" \
            '{
              schema: "evidence-graph/v1",
              document: {
                id: ("document:" + $build_subject_id),
                type: "subject",
                issuer: $issuer,
                created_at: $issued_at
              },
              subject: {
                id: $build_subject_id,
                type: "build",
                primary_digest: $dockerfile_sha256
              },
              relations: [
                {
                  relation_type: "built-from",
                  source_subject_id: $source_subject_id,
                  target_subject_id: $build_subject_id
                },
                {
                  relation_type: "built-from",
                  source_subject_id: $dependency_subject_id,
                  target_subject_id: $build_subject_id
                },
                {
                  relation_type: "built-from",
                  source_subject_id: $builder_subject_id,
                  target_subject_id: $build_subject_id
                },
                {
                  relation_type: "produces",
                  source_subject_id: $build_subject_id,
                  target_subject_id: $artifact_subject_id
                }
              ],
              evidence: [
                {
                  evidence_type: "test",
                  subject_id: $build_subject_id,
                  immutable_reference: {
                    repository: $evidence_repository,
                    package: "broker-evidence",
                    version: $evidence_version,
                    file: "test-result.json"
                  },
                  digest: $test_result_sha256,
                  issuer: $issuer,
                  issued_at: $issued_at
                }
              ],
              policy: {
                bundle_id: "not-recorded",
                decision: "pending",
                exception: null,
                approval: {
                  status: "not-recorded"
                }
              },
              lifecycle: {
                status: "pending",
                target_lane: "staging"
              },
              build: {
                definition: {
                  path: "Dockerfile",
                  digest: $dockerfile_sha256
                },
                builder: {
                  artifact_subject_id: $builder_subject_id,
                  image: $builder_image,
                  digest: $builder_digest,
                  canonical_payload_digest: $builder_canonical_payload_digest,
                  artifact_repository: $builder_artifact_repository,
                  evidence: {
                    repository: $builder_evidence_repository,
                    package: "broker-builder-evidence",
                    version: $builder_evidence_version
                  },
                  signer_repository: $builder_signer_repository,
                  signer_workflow: $builder_signer_workflow,
                  source_ref: $builder_source_ref,
                  local_materialization: {
                    verified: true,
                    mode: "immutable-digest-local-runtime-copy"
                  },
                  runner_identity: "github-hosted:ubuntu-24.04"
                },
                toolchain: {
                  go_directive: $go_directive,
                  go_toolchain: $go_toolchain,
                  goos: "linux",
                  goarch: "amd64",
                  cgo_enabled: false
                }
              }
            }' > "$package_directory/build.subject.payload.json"

          jq -n \
            --arg issuer "$issuer" \
            --arg issued_at "$issued_at" \
            --arg build_subject_id "$build_subject_id" \
            --arg artifact_subject_id "$artifact_subject_id" \
            --arg source_image "$IMAGE" \
            --arg image_digest "$DIGEST" \
            --arg artifact_repository "$ARTIFACT_REPOSITORY" \
            --arg evidence_repository "$EVIDENCE_ARTIFACT_REPOSITORY" \
            --arg evidence_version "$evidence_version" \
            --arg sbom_sha256 "sha256:${sbom_sha256}" \
            --arg signature_sha256 "sha256:${signature_sha256}" \
            --arg provenance_bundle_sha256 "sha256:${provenance_bundle_sha256}" \
            --arg sbom_bundle_sha256 "sha256:${sbom_bundle_sha256}" \
            --arg certificate_identity "$issuer" \
            '{
              schema: "evidence-graph/v1",
              document: {
                id: ("document:" + $artifact_subject_id),
                type: "subject",
                issuer: $issuer,
                created_at: $issued_at
              },
              subject: {
                id: $artifact_subject_id,
                type: "artifact",
                primary_digest: $image_digest
              },
              relations: [
                {
                  relation_type: "produces",
                  source_subject_id: $build_subject_id,
                  target_subject_id: $artifact_subject_id
                }
              ],
              evidence: [
                {
                  evidence_type: "sbom",
                  subject_id: $artifact_subject_id,
                  immutable_reference: {
                    repository: $evidence_repository,
                    package: "broker-evidence",
                    version: $evidence_version,
                    file: "broker.spdx.json"
                  },
                  digest: $sbom_sha256,
                  issuer: $issuer,
                  issued_at: $issued_at
                },
                {
                  evidence_type: "signature",
                  subject_id: $artifact_subject_id,
                  immutable_reference: {
                    repository: $evidence_repository,
                    package: "broker-evidence",
                    version: $evidence_version,
                    file: "signature.json"
                  },
                  digest: $signature_sha256,
                  issuer: $certificate_identity,
                  issued_at: $issued_at
                },
                {
                  evidence_type: "provenance",
                  subject_id: $artifact_subject_id,
                  immutable_reference: {
                    repository: $evidence_repository,
                    package: "broker-evidence",
                    version: $evidence_version,
                    file: "provenance.intoto.jsonl"
                  },
                  digest: $provenance_bundle_sha256,
                  issuer: $issuer,
                  issued_at: $issued_at
                },
                {
                  evidence_type: "attestation",
                  subject_id: $artifact_subject_id,
                  immutable_reference: {
                    repository: $evidence_repository,
                    package: "broker-evidence",
                    version: $evidence_version,
                    file: "sbom.intoto.jsonl"
                  },
                  digest: $sbom_bundle_sha256,
                  issuer: $issuer,
                  issued_at: $issued_at
                }
              ],
              policy: {
                bundle_id: "not-recorded",
                decision: "pending",
                exception: null,
                approval: {
                  status: "not-recorded"
                }
              },
              lifecycle: {
                status: "pending",
                target_lane: "staging",
                phase_status_at_issuance: {
                  promotion: "not-recorded",
                  deployment: "not-recorded",
                  operation: "not-recorded"
                }
              },
              artifact: {
                format: "oci",
                repository: $artifact_repository,
                reference: $source_image,
                digest: $image_digest
              }
            }' > "$package_directory/artifact.subject.payload.json"

          for subject_type in promotion operation; do
            jq -n \
              --arg issuer "$issuer" \
              --arg issued_at "$issued_at" \
              --arg subject_type "$subject_type" \
              --arg image_digest "$DIGEST" \
              '{
                schema: "evidence-graph/v1",
                document: {
                  id: ("document:" + $subject_type + ":not-recorded:" + $image_digest),
                  type: "subject",
                  issuer: $issuer,
                  created_at: $issued_at
                },
                subject: {
                  id: ($subject_type + ":not-recorded:" + $image_digest),
                  type: $subject_type,
                  primary_digest: $image_digest
                },
                relations: [],
                evidence: [],
                policy: {
                  bundle_id: "not-recorded",
                  decision: "not-recorded",
                  exception: null,
                  approval: {
                    status: "not-recorded"
                  }
                },
                lifecycle: {
                  status: "not-recorded",
                  target_lane: "not-recorded"
                }
              }' > "$package_directory/${subject_type}.not-recorded.subject.payload.json"
          done

          echo "directory=$package_directory" >> "$GITHUB_OUTPUT"
          echo "issuer=$issuer" >> "$GITHUB_OUTPUT"
          echo "version=$evidence_version" >> "$GITHUB_OUTPUT"

      - name: Seal immutable staging evidence subjects
        uses: ./.github/actions/seal-evidence-subject
        with:
          directory: ${{ steps.evidence.outputs.directory }}
          issuer: ${{ steps.evidence.outputs.issuer }}
          evidence-repository: ${{ env.EVIDENCE_ARTIFACT_REPOSITORY }}
          evidence-package: broker-evidence
          evidence-version: ${{ steps.evidence.outputs.version }}

      - name: Store immutable staging evidence graph
        shell: bash
        env:
          DIRECTORY: ${{ steps.evidence.outputs.directory }}
          EVIDENCE_VERSION: ${{ steps.evidence.outputs.version }}
        run: |
          set -euo pipefail
          gcloud artifacts generic upload \
            --project="$GCP_PROJECT_ID" \
            --location="$GCP_REGION" \
            --repository="$EVIDENCE_ARTIFACT_REPOSITORY" \
            --package=broker-evidence \
            --version="$EVIDENCE_VERSION" \
            --source-directory="$DIRECTORY" \
            --skip-existing

      - name: Deploy private staging broker
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$BROKER_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="${{ steps.image.outputs.reference }}" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=1 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=10s \
            --execution-environment=gen2 \
            --set-env-vars="^@^BROKER_APP_ID=${BROKER_APP_ID}@BROKER_APP_INSTALLATION_ID=${BROKER_APP_INSTALLATION_ID}@BROKER_CREDENTIAL_PROFILE=release-automation@BROKER_PRIVATE_KEY_PATH=/var/run/secrets/github-app/private-key.pem@BROKER_ALLOWED_REPOSITORIES=${BROKER_ALLOWED_REPOSITORIES}" \
            --update-secrets="/var/run/secrets/github-app/private-key.pem=${BROKER_SECRET}:1" \
            --quiet

      - name: Grant only staging invoker access
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding "$BROKER_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --member="serviceAccount:${INVOKER_SERVICE_ACCOUNT}" \
            --role="roles/run.invoker" \
            --quiet

      - name: Record immutable staging deployment subject
        uses: ./.github/actions/record-broker-deployment-evidence
        with:
          image: ${{ steps.image.outputs.reference }}
          project-id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          evidence-repository: ${{ env.EVIDENCE_ARTIFACT_REPOSITORY }}
          service: ${{ env.BROKER_SERVICE }}
          lane: staging
          workflow: .github/workflows/gcp-broker-staging.yml
          source-ref: refs/heads/develop
          environment: gcp-broker-staging
