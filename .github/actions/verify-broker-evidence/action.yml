name: Verify Broker Evidence
description: Re-verifies immutable staging and approved builder evidence before a production deployment.

inputs:
  image:
    description: Full immutable production image reference.
    required: true
  project-id:
    description: Google Cloud project that owns the evidence repository.
    required: true
  region:
    description: Artifact Registry region.
    required: true
  evidence-repository:
    description: Generic Artifact Registry repository containing the evidence package.
    required: true
  signer-workflow:
    description: Repository-relative staging workflow path that signs and attests the image.
    required: true
  source-ref:
    description: Trusted Git ref for the staging evidence workflow.
    required: true
  require-promotion:
    description: Whether the evidence package must contain a verified lane-specific promotion subject.
    required: false
    default: "false"
  promotion-lane:
    description: Expected functional lane of the promotion subject when promotion is required.
    required: false
    default: ""
  promotion-workflow:
    description: Expected repository-relative promotion workflow when promotion is required.
    required: false
    default: ""

outputs:
  source-image:
    description: Immutable staging image verified by this action.
    value: ${{ steps.verify.outputs.source-image }}
  source-commit:
    description: Source commit recorded in the verified manifest.
    value: ${{ steps.verify.outputs.source-commit }}

runs:
  using: composite
  steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # cosign-installer v4.1.2
      with:
        cosign-release: v3.1.3

    - id: verify
      name: Verify immutable container evidence
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        GCP_PROJECT_ID: ${{ inputs.project-id }}
        GCP_REGION: ${{ inputs.region }}
        EVIDENCE_ARTIFACT_REPOSITORY: ${{ inputs.evidence-repository }}
        SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
        SOURCE_REF: ${{ inputs.source-ref }}
        REQUIRE_PROMOTION: ${{ inputs.require-promotion }}
        PROMOTION_LANE: ${{ inputs.promotion-lane }}
        PROMOTION_WORKFLOW: ${{ inputs.promotion-workflow }}
      run: |
        set -euo pipefail
        digest="${IMAGE##*@sha256:}"
        test "${#digest}" -eq 64
        test "$digest" = "$(printf '%s' "$digest" | tr -cd '0-9a-f')"
        case "$REQUIRE_PROMOTION" in
          true|false)
            ;;
          *)
            echo "require-promotion must be true or false" >&2
            exit 1
            ;;
        esac
        if test "$REQUIRE_PROMOTION" = "true"; then
          test -n "$PROMOTION_LANE"
          test -n "$PROMOTION_WORKFLOW"
        fi

        registry="${GCP_REGION}-docker.pkg.dev"
        evidence_directory="$(mktemp -d)"
        docker_config="$(mktemp -d)"
        export DOCKER_CONFIG="$docker_config"
        cleanup() {
          docker logout "$registry" >/dev/null 2>&1 || true
          rm -rf "$docker_config" "$evidence_directory"
        }
        trap cleanup EXIT
        access_token="$(gcloud auth print-access-token)"
        printf '%s' "$access_token" | docker login "$registry" --username oauth2accesstoken --password-stdin >/dev/null
        unset access_token

        gcloud artifacts generic download \
          --project="$GCP_PROJECT_ID" \
          --location="$GCP_REGION" \
          --repository="$EVIDENCE_ARTIFACT_REPOSITORY" \
          --package=broker-evidence \
          --version="$digest" \
          --destination="$evidence_directory"

        expected_digest="sha256:${digest}"
        expected_version="$digest"
        certificate_identity="https://github.com/${GITHUB_REPOSITORY}/${SIGNER_WORKFLOW}@${SOURCE_REF}"
        source_repository="https://github.com/${GITHUB_REPOSITORY}"

        verify_subject() {
          local document="$1"
          local expected_type="$2"
          local expected_subject_id="$3"
          local canonical
          local canonical_payload_digest
          local expected_issuer
          local signature_bundle
          local signature_bundle_digest
          local signature_file

          test -f "$document"
          expected_issuer="${4:-$certificate_identity}"
          signature_file="$(jq -er '.integrity.signature.immutable_reference.file' "$document")"
          signature_bundle="$evidence_directory/$signature_file"
          test -f "$signature_bundle"

          canonical="$(mktemp)"
          jq 'del(.integrity)' "$document" | jq -cS . > "$canonical"
          canonical_payload_digest="sha256:$(sha256sum "$canonical" | awk '{print $1}')"
          signature_bundle_digest="sha256:$(sha256sum "$signature_bundle" | awk '{print $1}')"

          jq -e \
            --arg expected_type "$expected_type" \
            --arg expected_subject_id "$expected_subject_id" \
            --arg canonical_payload_digest "$canonical_payload_digest" \
            --arg signature_bundle_digest "$signature_bundle_digest" \
            --arg signature_file "$signature_file" \
            --arg issuer "$expected_issuer" \
            --arg version "$expected_version" \
            '.schema == "evidence-graph/v1" and
             .document.type == "subject" and
             (.document.id | type == "string" and length > 0) and
             .document.issuer == $issuer and
             (.document.created_at | type == "string" and length > 0) and
             .subject.type == $expected_type and
             .subject.id == $expected_subject_id and
             (.subject.primary_digest | type == "string" and length > 0) and
             (.relations | type == "array") and
             (.evidence | type == "array") and
             all(.evidence[];
               (.evidence_type | type == "string" and length > 0) and
               .subject_id == $expected_subject_id and
               (.immutable_reference | type == "object") and
               (.immutable_reference.repository | type == "string" and length > 0) and
               .immutable_reference.package == "broker-evidence" and
               (.immutable_reference.version | type == "string" and length > 0) and
               (.immutable_reference.file | type == "string" and length > 0) and
               (.digest | test("^sha256:[0-9a-f]{64}$")) and
               (.issuer | type == "string" and length > 0) and
               (.issued_at | type == "string" and length > 0)
             ) and
             (.policy | type == "object") and
             (.lifecycle | type == "object") and
             (.lifecycle.status == "not-recorded" or
              .lifecycle.status == "pending" or
              .lifecycle.status == "verified" or
              .lifecycle.status == "failed" or
              .lifecycle.status == "revoked" or
              .lifecycle.status == "quarantined" or
              .lifecycle.status == "superseded") and
             .integrity.canonicalization == "utf8-json-sorted-keys-v1" and
             .integrity.canonical_payload_digest == $canonical_payload_digest and
             .integrity.signature.evidence_type == "signature" and
             .integrity.signature.subject_id == $expected_subject_id and
             .integrity.signature.digest == $signature_bundle_digest and
             .integrity.signature.issuer == $issuer and
             (.integrity.signature.issued_at | type == "string" and length > 0) and
             (.integrity.signature.immutable_reference.repository | type == "string" and length > 0) and
             .integrity.signature.immutable_reference.package == "broker-evidence" and
             .integrity.signature.immutable_reference.version == $version and
             .integrity.signature.immutable_reference.file == $signature_file' \
            "$document" >/dev/null
          cosign verify-blob "$canonical" \
            --bundle "$signature_bundle" \
            --certificate-identity="$expected_issuer" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" >/dev/null
          rm -f "$canonical"
        }

        source_subject="$evidence_directory/source.subject.json"
        dependency_subject="$evidence_directory/dependency-resolution.subject.json"
        build_subject="$evidence_directory/build.subject.json"
        artifact_subject="$evidence_directory/artifact.subject.json"
        dependency_resolution="$evidence_directory/dependency-resolution.json"
        test_result="$evidence_directory/test-result.json"
        sbom="$evidence_directory/broker.spdx.json"
        signature="$evidence_directory/signature.json"
        provenance_bundle="$evidence_directory/provenance.intoto.jsonl"
        sbom_bundle="$evidence_directory/sbom.intoto.jsonl"
        test -f "$dependency_resolution"
        test -f "$test_result"
        test -f "$sbom"
        test -f "$signature"
        test -f "$provenance_bundle"
        test -f "$sbom_bundle"

        source_commit="$(jq -er '.source.commit' "$source_subject")"
        source_subject_id="$(jq -er '.subject.id' "$source_subject")"
        dependency_subject_id="$(jq -er '.subject.id' "$dependency_subject")"
        build_subject_id="$(jq -er '.subject.id' "$build_subject")"
        artifact_subject_id="$(jq -er '.subject.id' "$artifact_subject")"
        source_image="$(jq -er '.artifact.reference' "$artifact_subject")"
        artifact_payload_digest="$(jq -er '.integrity.canonical_payload_digest' "$artifact_subject")"
        source_evidence_repository="$(jq -er '.dependency_resolution.module_graph.immutable_reference.repository' "$dependency_subject")"
        builder_image="$(jq -er '.build.builder.image' "$build_subject")"
        builder_subject_id="$(jq -er '.build.builder.artifact_subject_id' "$build_subject")"
        builder_digest="$(jq -er '.build.builder.digest' "$build_subject")"
        builder_payload_digest="$(jq -er '.build.builder.canonical_payload_digest' "$build_subject")"
        builder_artifact_repository="$(jq -er '.build.builder.artifact_repository' "$build_subject")"
        builder_evidence_repository="$(jq -er '.build.builder.evidence.repository' "$build_subject")"
        builder_evidence_package="$(jq -er '.build.builder.evidence.package' "$build_subject")"
        builder_evidence_version="$(jq -er '.build.builder.evidence.version' "$build_subject")"
        builder_signer_repository="$(jq -er '.build.builder.signer_repository' "$build_subject")"
        builder_signer_workflow="$(jq -er '.build.builder.signer_workflow' "$build_subject")"
        builder_source_ref="$(jq -er '.build.builder.source_ref' "$build_subject")"
        test -n "$source_evidence_repository"

        verify_subject "$source_subject" source "$source_subject_id"
        verify_subject "$dependency_subject" dependency-resolution "$dependency_subject_id"
        verify_subject "$build_subject" build "$build_subject_id"
        verify_subject "$artifact_subject" artifact "$artifact_subject_id"

        jq -e \
          --arg source_repository "$source_repository" \
          --arg source_ref "$SOURCE_REF" \
          --arg source_subject_id "$source_subject_id" \
          --arg dependency_subject_id "$dependency_subject_id" \
          '.source.repository == $source_repository and
           (.source.commit | test("^[0-9a-f]{40}$")) and
           (.source.tree | test("^[0-9a-f]{40}$")) and
           .source.protected_ref == $source_ref and
           .policy.decision == "verified" and
           .lifecycle.status == "verified" and
           ([.relations[] | select(
             .relation_type == "resolves" and
             .source_subject_id == $source_subject_id and
             .target_subject_id == $dependency_subject_id
           )] | length) == 1' \
          "$source_subject" >/dev/null

        dependency_resolution_sha256="sha256:$(sha256sum "$dependency_resolution" | awk '{print $1}')"
        jq -e \
          --arg dependency_subject_id "$dependency_subject_id" \
          --arg source_subject_id "$source_subject_id" \
          --arg build_subject_id "$build_subject_id" \
          --arg dependency_resolution_sha256 "$dependency_resolution_sha256" \
          --arg version "$expected_version" \
          '.dependency_resolution.go_mod.path == "go.mod" and
           (.dependency_resolution.go_mod.digest | test("^sha256:[0-9a-f]{64}$")) and
           (.dependency_resolution.go_sum == null or
             (.dependency_resolution.go_sum.path == "go.sum" and
              (.dependency_resolution.go_sum.digest | test("^sha256:[0-9a-f]{64}$")))) and
           (.dependency_resolution.module_graph.immutable_reference.repository | type == "string" and length > 0) and
           .dependency_resolution.module_graph.immutable_reference.package == "broker-evidence" and
           .dependency_resolution.module_graph.immutable_reference.version == $version and
           .dependency_resolution.module_graph.immutable_reference.file == "dependency-resolution.json" and
           .dependency_resolution.module_graph.digest == $dependency_resolution_sha256 and
           .dependency_resolution.admission.status == "verified" and
           .lifecycle.status == "verified" and
           ([.relations[] | select(
             .relation_type == "resolves" and
             .source_subject_id == $source_subject_id and
             .target_subject_id == $dependency_subject_id
           )] | length) == 1 and
           ([.relations[] | select(
             .relation_type == "built-from" and
             .source_subject_id == $dependency_subject_id and
             .target_subject_id == $build_subject_id
           )] | length) == 1' \
          "$dependency_subject" >/dev/null
        jq -e 'type == "array" and length > 0 and all(.[]; (.Path | type == "string" and length > 0))' "$dependency_resolution" >/dev/null

        test_result_sha256="sha256:$(sha256sum "$test_result" | awk '{print $1}')"
        jq -e \
          --arg source_subject_id "$source_subject_id" \
          --arg dependency_subject_id "$dependency_subject_id" \
          --arg build_subject_id "$build_subject_id" \
          --arg artifact_subject_id "$artifact_subject_id" \
          --arg builder_subject_id "$builder_subject_id" \
          --arg builder_image "$builder_image" \
          --arg builder_digest "$builder_digest" \
          --arg builder_payload_digest "$builder_payload_digest" \
          --arg builder_artifact_repository "$builder_artifact_repository" \
          --arg builder_evidence_repository "$builder_evidence_repository" \
          --arg builder_evidence_package "$builder_evidence_package" \
          --arg builder_evidence_version "$builder_evidence_version" \
          --arg builder_signer_repository "$builder_signer_repository" \
          --arg builder_signer_workflow "$builder_signer_workflow" \
          --arg builder_source_ref "$builder_source_ref" \
          --arg repository "$source_evidence_repository" \
          --arg version "$expected_version" \
          --arg test_result_sha256 "$test_result_sha256" \
          '.build.definition.path == "Dockerfile" and
           (.build.definition.digest | test("^sha256:[0-9a-f]{64}$")) and
           .build.builder.artifact_subject_id == $builder_subject_id and
           .build.builder.image == $builder_image and
           .build.builder.digest == $builder_digest and
           .build.builder.canonical_payload_digest == $builder_payload_digest and
           .build.builder.artifact_repository == $builder_artifact_repository and
           .build.builder.evidence.repository == $builder_evidence_repository and
           .build.builder.evidence.package == $builder_evidence_package and
           .build.builder.evidence.version == $builder_evidence_version and
           .build.builder.signer_repository == $builder_signer_repository and
           .build.builder.signer_workflow == $builder_signer_workflow and
           .build.builder.source_ref == $builder_source_ref and
           .build.builder.local_materialization.verified == true and
           .build.builder.local_materialization.mode == "immutable-digest-local-runtime-copy" and
           .build.builder.runner_identity == "github-hosted:ubuntu-24.04" and
           (.build.toolchain.go_directive | test("^[0-9]+\\.[0-9]+$")) and
           (.build.toolchain.go_toolchain | test("^go[0-9]+\\.[0-9]+\\.[0-9]+$")) and
           .build.toolchain.goos == "linux" and
           .build.toolchain.goarch == "amd64" and
           .build.toolchain.cgo_enabled == false and
           .lifecycle.status == "verified" and
           any(.evidence[]; .evidence_type == "test" and
             .subject_id == $build_subject_id and
             .immutable_reference.repository == $repository and
             .immutable_reference.package == "broker-evidence" and
             .immutable_reference.version == $version and
             .immutable_reference.file == "test-result.json" and
             .digest == $test_result_sha256) and
           ([.relations[] | select(
             .relation_type == "built-from" and
             .source_subject_id == $source_subject_id and
             .target_subject_id == $build_subject_id
           )] | length) == 1 and
           ([.relations[] | select(
             .relation_type == "built-from" and
             .source_subject_id == $dependency_subject_id and
             .target_subject_id == $build_subject_id
           )] | length) == 1 and
           ([.relations[] | select(
             .relation_type == "built-from" and
             .source_subject_id == $builder_subject_id and
             .target_subject_id == $build_subject_id
           )] | length) == 1 and
           ([.relations[] | select(
             .relation_type == "produces" and
             .source_subject_id == $build_subject_id and
             .target_subject_id == $artifact_subject_id
           )] | length) == 1' \
          "$build_subject" >/dev/null
        jq -e \
          --arg source_commit "$source_commit" \
          --arg builder_image "$builder_image" \
          --arg builder_subject_id "$builder_subject_id" \
          --arg builder_digest "$builder_digest" \
          --arg builder_payload_digest "$builder_payload_digest" \
          '(.source_commit == $source_commit) and
           .evidence_type == "test" and
           .status == "passed" and
           .builder_image == $builder_image and
           .builder_subject_id == $builder_subject_id and
           .builder_digest == $builder_digest and
           .builder_canonical_payload_digest == $builder_payload_digest and
           (.commands | type == "array" and length == 2) and
           (.go_toolchain | test("^go[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
          "$test_result" >/dev/null

        test "$builder_evidence_package" = "broker-builder-evidence"
        [[ "$builder_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        [[ "$builder_payload_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        GITHUB_OUTPUT=/dev/null \
          BUILDER_IMAGE="$builder_image" \
          BUILDER_ARTIFACT_REPOSITORY="$builder_artifact_repository" \
          BUILDER_EVIDENCE_ARTIFACT_REPOSITORY="$builder_evidence_repository" \
          BUILDER_SIGNER_REPOSITORY="$builder_signer_repository" \
          BUILDER_SIGNER_WORKFLOW="$builder_signer_workflow" \
          BUILDER_SOURCE_REF="$builder_source_ref" \
          bash "$GITHUB_ACTION_PATH/../verify-broker-builder-evidence/verify.sh"

        sbom_sha256="sha256:$(sha256sum "$sbom" | awk '{print $1}')"
        signature_sha256="sha256:$(sha256sum "$signature" | awk '{print $1}')"
        provenance_bundle_sha256="sha256:$(sha256sum "$provenance_bundle" | awk '{print $1}')"
        sbom_bundle_sha256="sha256:$(sha256sum "$sbom_bundle" | awk '{print $1}')"
        jq -e \
          --arg expected_digest "$expected_digest" \
          --arg source_image "$source_image" \
          --arg build_subject_id "$build_subject_id" \
          --arg artifact_subject_id "$artifact_subject_id" \
          --arg repository "$source_evidence_repository" \
          --arg version "$expected_version" \
          --arg sbom_sha256 "$sbom_sha256" \
          --arg signature_sha256 "$signature_sha256" \
          --arg provenance_bundle_sha256 "$provenance_bundle_sha256" \
          --arg sbom_bundle_sha256 "$sbom_bundle_sha256" \
          --arg certificate_identity "$certificate_identity" \
          '.subject.primary_digest == $expected_digest and
           .artifact.format == "oci" and
           .artifact.reference == $source_image and
           .artifact.digest == $expected_digest and
           (.artifact.reference | endswith("@" + $expected_digest)) and
           .policy.decision == "verified" and
           .lifecycle.status == "verified" and
           any(.evidence[]; .evidence_type == "sbom" and
             .subject_id == $artifact_subject_id and
             .immutable_reference.repository == $repository and
             .immutable_reference.package == "broker-evidence" and
             .immutable_reference.version == $version and
             .immutable_reference.file == "broker.spdx.json" and
             .digest == $sbom_sha256) and
           any(.evidence[]; .evidence_type == "signature" and
             .subject_id == $artifact_subject_id and
             .immutable_reference.repository == $repository and
             .immutable_reference.file == "signature.json" and
             .digest == $signature_sha256 and
             .issuer == $certificate_identity) and
           any(.evidence[]; .evidence_type == "provenance" and
             .subject_id == $artifact_subject_id and
             .immutable_reference.repository == $repository and
             .immutable_reference.file == "provenance.intoto.jsonl" and
             .digest == $provenance_bundle_sha256) and
           any(.evidence[]; .evidence_type == "attestation" and
             .subject_id == $artifact_subject_id and
             .immutable_reference.repository == $repository and
             .immutable_reference.file == "sbom.intoto.jsonl" and
             .digest == $sbom_bundle_sha256) and
           ([.relations[] | select(
             .relation_type == "produces" and
             .source_subject_id == $build_subject_id and
             .target_subject_id == $artifact_subject_id
           )] | length) == 1' \
          "$artifact_subject" >/dev/null

        if test "$REQUIRE_PROMOTION" = "true"; then
          promotion_subject="$evidence_directory/promotion.subject.json"
          promotion_approval="$evidence_directory/promotion-approval.json"
          promotion_subject_id="promotion:${PROMOTION_LANE}:${expected_digest}"
          promotion_certificate_identity="https://github.com/${GITHUB_REPOSITORY}/${PROMOTION_WORKFLOW}@refs/heads/main"
          test -f "$promotion_approval"
          verify_subject "$promotion_subject" promotion "$promotion_subject_id" "$promotion_certificate_identity"
          promotion_approval_sha256="sha256:$(sha256sum "$promotion_approval" | awk '{print $1}')"
          jq -e \
            --arg expected_digest "$expected_digest" \
            --arg expected_image "$IMAGE" \
            --arg artifact_subject_id "$artifact_subject_id" \
            --arg promotion_subject_id "$promotion_subject_id" \
            --arg promotion_lane "$PROMOTION_LANE" \
            --arg promotion_workflow "$PROMOTION_WORKFLOW" \
            --arg artifact_payload_digest "$artifact_payload_digest" \
            --arg promotion_approval_sha256 "$promotion_approval_sha256" \
            '.subject.primary_digest == $expected_digest and
             .lifecycle.status == "verified" and
             .lifecycle.target_lane == $promotion_lane and
             .policy.decision == "verified" and
             .policy.approval.status == "verified" and
             .lifecycle.phase_references.source_artifact_subject_id == $artifact_subject_id and
             .lifecycle.phase_references.source_artifact_canonical_payload_digest == $artifact_payload_digest and
             .lifecycle.phase_references.source_digest == $expected_digest and
             .lifecycle.phase_references.target_image == $expected_image and
             ([.relations[] | select(
               .relation_type == "promotes" and
               .source_subject_id == $artifact_subject_id and
               .target_subject_id == $promotion_subject_id
             )] | length) == 1 and
             any(.evidence[]; .evidence_type == "approval" and
               .subject_id == $promotion_subject_id and
               .immutable_reference.file == "promotion-approval.json" and
               .digest == $promotion_approval_sha256)' \
            "$promotion_subject" >/dev/null
          jq -e \
            --arg promotion_subject_id "$promotion_subject_id" \
            --arg promotion_workflow "$PROMOTION_WORKFLOW" \
            '.schema == "evidence-graph/v1" and
             .evidence_type == "approval" and
             .subject_id == $promotion_subject_id and
             .authorization.workflow == $promotion_workflow and
             .authorization.decision == "verified"' \
            "$promotion_approval" >/dev/null
        fi

        cosign verify \
          --certificate-identity="$certificate_identity" \
          --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
          "$source_image" >/dev/null

        gh attestation verify \
          "oci://${source_image}" \
          --repo "$GITHUB_REPOSITORY" \
          --signer-workflow "${GITHUB_REPOSITORY}/${SIGNER_WORKFLOW}" \
          --source-ref "$SOURCE_REF" \
          --source-digest "$source_commit" \
          --deny-self-hosted-runners \
          --bundle-from-oci >/dev/null
        gh attestation verify \
          "oci://${source_image}" \
          --repo "$GITHUB_REPOSITORY" \
          --signer-workflow "${GITHUB_REPOSITORY}/${SIGNER_WORKFLOW}" \
          --source-ref "$SOURCE_REF" \
          --source-digest "$source_commit" \
          --deny-self-hosted-runners \
          --predicate-type "https://spdx.dev/Document/v2.3" \
          --bundle-from-oci >/dev/null

        echo "source-image=$source_image" >> "$GITHUB_OUTPUT"
        echo "source-commit=$source_commit" >> "$GITHUB_OUTPUT"
